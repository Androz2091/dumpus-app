name: Build and Release Android App

on:
  release:
    types: [created]
  # A release attaches the AAB and the APK, then sends the AAB to Google
  # Play's production track for review, with the release's first paragraph as
  # its notes, rolled out to everyone once approved. A manual run builds
  # without publishing anything; with `submit`, it sends the AAB of
  # package.json's version's release to Google Play instead.
  workflow_dispatch:
    inputs:
      submit:
        description: Send this version's release AAB to Google Play instead of building
        type: boolean
        default: false

jobs:
  release:
    if: ${{ !inputs.submit }}
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode and set up Android Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "zulu" # Azul Zulu distribution

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Mobile App
        run: pnpm run build:mobile

      - name: Build Android App (AAB)
        run: pnpm run script:build-android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_RELEASE_TYPE: AAB

      - name: Upload AAB Release Asset
        id: upload-aab-release-asset
        run: gh release upload "$RELEASE_TAG" ./android/app/build/outputs/bundle/release/app-release-signed.aab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        if: github.event_name == 'release'

      - name: Archive AAB as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-signed.aab
          path: ./android/app/build/outputs/bundle/release/app-release-signed.aab
        if: github.event_name != 'release'

      - name: Build Android App (APK)
        run: pnpm run script:build-android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_RELEASE_TYPE: APK

      - name: Upload APK Release Asset
        id: upload-apk-release-asset
        run: gh release upload "$RELEASE_TAG" ./android/app/build/outputs/apk/release/app-release-signed.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        if: github.event_name == 'release'

      - name: Archive APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-signed.apk
          path: ./android/app/build/outputs/apk/release/app-release-signed.apk
        if: github.event_name != 'release'

      # Last, so a Google Play failure leaves the release's assets complete.
      - name: Check for Google Play credentials
        id: play
        run: |
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          [ "$READY" = true ] || echo "::notice::PLAY_SERVICE_ACCOUNT_JSON isn't set, so the AAB isn't sent to Google Play."
        env:
          READY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        if: github.event_name == 'release'

      - name: Store notes from the release
        run: node scripts/store-notes.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          STORE_NOTES_DIR: ${{ runner.temp }}/store-notes
        if: steps.play.outputs.ready == 'true'

      - name: Send the AAB to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.dumpus.app
          releaseFiles: ./android/app/build/outputs/bundle/release/app-release-signed.aab
          tracks: production
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/store-notes/play
        if: steps.play.outputs.ready == 'true'

  submit:
    if: ${{ inputs.submit }}
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for Google Play credentials
        run: |
          if [ "$READY" != true ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON isn't set: add the service account's JSON key as that secret first."
            exit 1
          fi
        env:
          READY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

      - name: Download the release's AAB
        run: gh release download "v$(node -p 'require("./package.json").version')" --pattern app-release-signed.aab --dir "$RUNNER_TEMP/aab"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Store notes from the release
        run: node scripts/store-notes.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STORE_NOTES_DIR: ${{ runner.temp }}/store-notes

      - name: Send the AAB to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.dumpus.app
          releaseFiles: ${{ runner.temp }}/aab/app-release-signed.aab
          tracks: production
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/store-notes/play
