name: E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "locales/**"
      - "e2e/**"
      - "processor/**"
      - "scripts/build-processor.cjs"
      - "scripts/list-locales.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.mjs"
      - "tailwind.config.ts"
      - "postcss.config.cjs"
      - "tsconfig.json"
      - "playwright.config.ts"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    # The image `pnpm test:e2e:docker` runs, on arm64 like an Apple Silicon
    # Mac. The image tag must match `@playwright/test`, Renovate bumps both
    # together.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host

    steps:
      - uses: actions/checkout@v7

      # The image's Node and the `packageManager` pnpm, like
      # `scripts/e2e-docker.sh`. npm installs it: the image's Node no longer
      # ships corepack.
      - run: npm install --global --allow-scripts=pnpm "$(node -p "require('./package.json').packageManager")"

      - run: pnpm install --frozen-lockfile

      # The build compiles the processor for the browser, to read a package
      # file on the device: `scripts/build-processor.cjs`.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: processor/go.sum

      # What the server writes for a package, which `e2e/file.spec.ts` checks
      # the device writes too.
      - name: Build dumpus-processor
        env:
          CGO_ENABLED: "0"
        run: go -C processor build -trimpath -buildvcs=false -o "$RUNNER_TEMP/dumpus-processor" ./cmd/dumpus-processor

      - name: Build and run the e2e suite
        run: DUMPUS_PROCESSOR="$RUNNER_TEMP/dumpus-processor" pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
