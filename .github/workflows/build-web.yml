name: Build web

on:
  pull_request:
    paths-ignore:
      - "api/**"
      - "landing/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # The build compiles the processor for the browser, to read a package
          # file on the device: `scripts/build-processor.cjs`.
          go-version: "1.26.x"
          cache-dependency-path: processor/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm run build
