# pnpm takes the nearest workspace file as the root, so this keeps the
# landing's install, lockfile and settings apart from the app's.
allowBuilds:
  # Its postinstall only fetches the native binary when the optional
  # dependency that ships it failed to install.
  esbuild: false
overrides:
  # jsdom, which renders the pages at build time, asks for 4.0.0, which has
  # two advisories (GHSA-fjxv-7rqg-78g4, GHSA-hmw2-7cc7-3qxx).
  form-data: ^4.0.6
